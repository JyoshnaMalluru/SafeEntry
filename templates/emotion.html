<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emotion CAPTCHA</title>
<style>
  /* ===== Base ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f7f8fa;
    color: #222;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }

  .container {
    background: #ffffff;
    max-width: 420px;
    width: 100%;
    padding: 28px 24px 32px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    text-align: center;
  }

  h2 {
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 24px;
    color: #333;
  }

  img {
    max-width: 100%;
    width: 260px;
    height: auto;
    border-radius: 12px;
    margin: 0 auto 24px;
    display: block;
    background: #f0f0f0;
  }

  input[type="text"], input[type="password"], input[type="email"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #dcdcdc;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
    background: #fafafa;
    transition: border 0.2s, background 0.2s;
  }

  input[type="text"]:focus,
  input[type="password"]:focus,
  input[type="email"]:focus {
    border-color: #b5b5b5;
    background: #fff;
  }

  button {
    margin-top: 18px;
    width: 100%;
    background: #f5f5f5;
    color: #222;
    padding: 12px;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }

  button:hover { background: #e9e9e9; }

  #result {
    margin-top: 20px;
    font-weight: 600;
    font-size: 1.1rem;
    color: #444;
    min-height: 24px;
  }

  /* Forms spacing */
  form { display: flex; flex-direction: column; gap: 12px; }

  /* Responsive */
  @media (max-width:480px) {
    body { padding: 20px; }
    h2 { font-size: 1.2rem; }
    img { width: 100%; max-width: 220px; }
    input, button { font-size: 0.95rem; padding: 10px 12px; }
  }
</style>
</head>
<body>
  <div class="container">
    <h2>Identify the emotion of the person below</h2>
    <img src="/static/emotions/{{ image }}" alt="Face for emotion CAPTCHA">
    
    <!-- Emotion CAPTCHA Form -->
    <form id="emoForm" action="/emotion/submit" method="POST">
      <input type="hidden" name="label" value="{{ label }}">
      <input type="text" name="answer" placeholder="happy / sad / angry" required>
      <button type="submit">Submit</button>
    </form>

    <div id="result"></div>
  </div>
</body>
</html>
