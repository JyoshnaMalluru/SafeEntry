<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Handwriting CAPTCHA</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
        background-color: #f9f9f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .card {
        background-color: #fff;
        padding: 30px 25px;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.06);
        width: 100%;
        max-width: 450px;
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
        color: #444;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 15px;
    }

    input[type="text"], input[type="password"], input[type="email"] {
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
        outline: none;
        background: #fafafa;
        transition: border-color 0.3s;
    }

    input:focus { border-color: #aaa; }

    button {
        padding: 12px;
        border: none;
        border-radius: 8px;
        background-color: #f1f1f1;
        cursor: pointer;
        font-size: 1rem;
        transition: background-color 0.3s;
    }

    button:hover { background-color: #e0e0e0; }

    #message, #captcha-result {
        margin-top: 10px;
        font-weight: bold;
        min-height: 20px;
        color: #444;
    }

    .captcha-container {
        margin-top: 20px;
    }

    .captcha-container img {
        max-width: 100%;
        height: auto;
        margin-bottom: 12px;
        border-radius: 8px;
        border: 1px solid #e0e0e0;
    }

    @media (max-width: 480px) {
        .card {
            padding: 25px 20px;
        }

        input, button {
            font-size: 0.95rem;
            padding: 10px 12px;
        }

        h2 {
            font-size: 1.2rem;
        }
    }
</style>
</head>
<body>

<div class="card">
    <h2>Sign Up/Login</h2>

    <!-- Login Form -->
    <form id="login-form">
        <input type="text" id="login-username" placeholder="Username" required>
        <input type="password" id="login-password" placeholder="Password" required>
    </form>

    <div id="message"></div>

    <!-- Handwriting CAPTCHA -->
    <div class="captcha-container">
        <h2>Type the phrase shown in the image</h2>
        <img src="{{ url_for('handwriting.handwriting_image') }}?phrase={{ phrase }}" alt="Handwriting CAPTCHA">
        <form id="hw-form" action="/handwriting/submit" method="POST">
            <input type="hidden" name="phrase" value="{{ phrase }}">
            <input type="text" name="answer" placeholder="Type here" required>
            <button type="submit">Submit</button>
        </form>
        <div id="captcha-result"></div>
    </div>
</div>

</body>
</html>
