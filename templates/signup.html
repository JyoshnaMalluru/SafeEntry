<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <style>
    body { background: #f9f9f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #fff; padding: 30px 25px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); width: 100%; max-width: 400px; text-align: center; }
    input, button { margin: 10px 0; padding: 10px; width: 90%; border-radius: 8px; border: 1px solid #ddd; }
    button { background: #f1f1f1; cursor: pointer; }
    button:hover { background: #e0e0e0; }
    .msg { color: red; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Sign Up</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="msg">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST">
      <input type="text" name="username" placeholder="Username" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</body>
</html>
